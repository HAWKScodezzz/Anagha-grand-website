<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Review Moderation | Anagha Grand</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body style="background-color: var(--color-light-bg);">

  <div class="admin-header">
    <div class="container admin-nav">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="32" height="32" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#C0392B" stroke-width="4"/>
          <path d="M35 68 L50 24 L65 68 Z" fill="#1E7B5D"/>
          <path d="M48 68 A 18 18 0 1 0 68 46 L54 46" fill="none" stroke="#E67E22" stroke-width="8" stroke-linecap="round"/>
        </svg>
        <span style="font-family: var(--font-heading); font-size: 1.4rem; font-weight: 800; color: var(--color-near-black);">
          Anagha Grand Admin Panel
        </span>
      </div>
      <div id="adminUserStatus">
        <a href="/" class="btn btn-outline-dark" style="padding: 6px 16px; font-size: 0.85rem;">View Main Site</a>
        <button id="logoutBtn" class="btn btn-primary" style="display: none; padding: 6px 16px; font-size: 0.85rem; margin-left: 10px;">Logout</button>
      </div>
    </div>
  </div>

  <div class="container" style="padding: 40px 0;">

    <!-- Login Container -->
    <div id="loginSection" class="review-form-card" style="max-width: 420px; margin: 40px auto;">
      <h2 class="highlight-title" style="text-align: center; margin-bottom: 8px;">Admin Authentication</h2>
      <p style="text-align: center; color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 24px;">Enter password to manage public customer reviews.</p>
      
      <div id="loginError" style="display: none; padding: 10px; background-color: #F8D7DA; color: #721C24; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.9rem; text-align: center;"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminPass">Admin Password</label>
          <input type="password" id="adminPass" class="form-input" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login to Dashboard</button>
      </form>
    </div>

    <!-- Dashboard Container (Hidden until logged in) -->
    <div id="dashboardSection" style="display: none;">
      
      <div class="admin-stats-grid">
        <div class="admin-stat-card">
          <div class="stat-num" id="statPending">0</div>
          <div class="stat-label">Pending Approval</div>
        </div>
        <div class="admin-stat-card">
          <div class="stat-num" id="statApproved" style="color: var(--color-grass-green);">0</div>
          <div class="stat-label">Approved Live</div>
        </div>
        <div class="admin-stat-card">
          <div class="stat-num" id="statRejected" style="color: var(--color-terracotta);">0</div>
          <div class="stat-label">Rejected</div>
        </div>
      </div>

      <div class="admin-controls">
        <h3 class="highlight-title">Customer Reviews Queue</h3>
        
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="approved">Approved</button>
          <button class="filter-btn" data-filter="rejected">Rejected</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Customer Name</th>
              <th>Type</th>
              <th>Rating</th>
              <th>Review Comment</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reviewsTableBody">
            <!-- Table rows populated dynamically -->
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
